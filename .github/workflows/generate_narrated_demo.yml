name: Generate Narrated Mystery Demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install video and speech dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          python3 -m pip install --break-system-packages Pillow
      - name: Render narrated mystery video
        run: python3 generate_video.py
      - name: Save video for download
        uses: actions/upload-artifact@v4
        with:
          name: mystery-narrated-demo
          path: output/mystery_episode_02.mp4
          retention-days: 7
